<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <script src="https://unpkg.com/three@0.126.0/build/three.js"></script>
    <title>Teste AR</title>
</head>
<body>
  <p1>Welcome!</p1>
  <button onclick="activateXR()">Start</button>
  <script>
    async function activateXR() {
    
    const canvas = document.createElement("canvas");
    document.body.appendChild(canvas);
    const gl = canvas.getContext("webgl", {xrCompatible: true});
    const scene = new THREE.Scene();

    /////////////////////////////////////////////ILUMINAÇÃO/////////////////////////////////////////////
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(1, 1, 1);
    scene.add(light);
    /////////////////////////////////////////////////////////////////////////////////////////////////////

    //////////////////////////////////////CONFIGURAÇÕES DO CUBO/////////////////////////////////////////
    const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const material = new THREE.MeshPhongMaterial({
        color: 0x00ff00,
        transparent: true,
        opacity: 0.8
    });
    const cube = new THREE.Mesh(geometry, material);
    cube.position.set(0, 0, -0.5);
    scene.add(cube);
    /////////////////////////////////////////////////////////////////////////////////////////////////////

    const camera = new THREE.PerspectiveCamera();
    camera.matrixAutoUpdate = false;

    const renderer = new THREE.WebGLRenderer({
        alpha: true,
        preserveDrawingBuffer: true,
        canvas: canvas,
        context: gl
    });
    renderer.autoClear = false;
    
    const session = await navigator.xr.requestSession("immersive-ar");
    session.updateRenderState({
        baseLayer: new XRWebGLLayer(session, gl)
    });
    
    const referenceSpace = await session.requestReferenceSpace('local');
    
    /////////// Este trecho cria um loop para atualizar constantemente a perspectiva da câmera ////////////
    
    const onXRFrame = (time, frame) => {
        session.requestAnimationFrame(onXRFrame);
        gl.bindFramebuffer(gl.FRAMEBUFFER, session.renderState.baseLayer.framebuffer);
        const pose = frame.getViewerPose(referenceSpace);
        if (pose) {
            const view = pose.views[0];

            camera.matrix.fromArray(view.transform.matrix);
            camera.projectionMatrix.fromArray(view.projectionMatrix);
            camera.updateMatrixWorld(true);
            
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            
            renderer.render(scene, camera);
        }
    };
    session.requestAnimationFrame(onXRFrame);
    
    ///////////////////////////////////////////////////////////////////////////////////////////////////////

    // function animate() {
    // renderer.render( scene, camera );
    // cube.rotation.x += 0.01;
    // cube.rotation.y += 0.01;
    // }
    // renderer.setAnimationLoop( animate );

    window.addEventListener('load', checkXRSupport);
}
  </script>
</body>
</html>
